# AI-DLC Default Configuration
# このファイルはスターターキットのデフォルト値を定義します
# プロジェクトの .aidlc/config.toml で上書き可能です
#
# 正本: aidlc スキルの config/defaults.toml
# このファイルは正本の配布用コピーです。
# 正本が更新された場合はこのファイルも同期してください。

[rules.feedback]
enabled = true
# Issue 送信先 owner/repo（v2.5.0 で追加 / Unit 005 / #590）
# - mirror モードの retrospective Issue 送信先
# - フォーク利用や貢献先変更時のみ user-global で上書きする
# - 形式: <owner>/<repo>（正規表現: ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ / `/` はちょうど 1 個）
# - 不正値時は警告 + デフォルト（ikeisuke/ai-dlc-starter-kit）にフォールバック
upstream_repo = "ikeisuke/ai-dlc-starter-kit"
# /aidlc feedback のブラウザ自動起動（v2.6.1 で追加 / Unit 003 / #690）
# - true: gh issue create --web 経路（GitHub Issue Form をブラウザ UI で表示）
# - false: gh issue create --body-file 経路（直接起票、デフォルト）
# 経路判定の優先順位: TTY 状態 > 設定 > フラグ
# - 非 TTY 環境（CI 等）では設定・フラグに関わらず常に直接起票
# - TTY で setting=true ならブラウザ、setting=false/未設定 + 環境変数 AIDLC_FEEDBACK_WEB=1 ならブラウザ
# - それ以外は直接起票
# 詳細真理値表は skills/aidlc-feedback/SKILL.md / steps/feedback.md 参照
open_in_browser = false

[rules.reviewing]
mode = "recommend"
# tools: 優先順位リスト = フォールバック順序。許容エントリは外部 CLI 名 / "self" / "claude"(alias)。
# review-routing.md §4 の暗黙末尾 self 補完シムにより、本デフォルト ["codex"] は実質
# ["codex", "self"] 相当として動作する（既存設定の後方互換性維持、Issue #611 / Unit 002）。
tools = ["codex"]
exclude_patterns = []
codex_bot_account = "chatgpt-codex-connector[bot]"

[rules.release]
changelog = false
version_tag = false

[rules.depth_level]
level = "standard"
history_level = ""

[rules.automation]
mode = "manual"

[rules.construction]
max_retry = 3

[rules.linting]
enabled = false
command = "npx markdownlint-cli2"

[rules.cycle]
mode = "default"
git_tracked = true

[rules.version_check]
enabled = true

[rules.git]
commit_on_unit_complete = true
commit_on_phase_complete = true
branch_mode = "ask"
unit_branch_enabled = false
squash_enabled = false
merge_method = "ask"
draft_pr = "ask"
ai_author = ""
ai_author_auto_detect = true

[rules.documentation]
language = "日本語"

[rules.github]
milestone_enabled = false

[rules.inception]
# Inception Phase の Unit 定義承認前に実行する「直近サイクル完了 Unit との重複チェック」で
# 参照する直近サイクル数（v2.6.5 / #712 / Unit 001）
# - 既定 3。完了 Unit スラグ + 関連 Issue CLOSED 状態と新規候補スラグを突合し、重複候補があれば
#   AskUserQuestion で「withdraw / continue_with_reason」を問う
# - 0 を指定すると重複検出を完全スキップ（明示的な opt-out）
# - 不正値（負数 / 非整数 / 文字列）時は read-config.sh ラッパー側で
#   stderr に warn 出力 + デフォルト値 3 にフォールバック（fail-safe: 重複検出を継続）
# - 詳細仕様は steps/inception/04-stories-units.md の「ステップ 4a」セクションを SoT として参照
dedup_lookback_cycles = 3

[rules.retrospective]
# 許容値（v2.5.1 / 5 値 enum）:
#   - "interactive"        : 04-completion §1.5 直前に wizard を起動して 5 値のいずれかに確定（新規セットアップ既定）
#   - "local-issue-only"   : プロダクトリポジトリの Issue にのみ起票
#   - "mirror-only"        : upstream（AI-DLC starter kit）の Issue にのみ起票
#   - "local-and-mirror"   : 両方に起票（合算 cap）
#   - "disabled"           : 起票しない（振り返り自体はローカル記録）
# 旧値（v2.5.0 まで）"silent" / "mirror" は `aidlc-migrate` で自動マイグレーションされる:
#   - "silent" → "interactive"（同意プロンプト必要 / 非対話時は disabled fallback）
#   - "mirror" → "mirror-only"（同意不要 / 動作互換）
#   - 未設定 → "interactive"（同意プロンプト必要 / 非対話時は disabled fallback）
# read-config.sh / write-config.sh は新値での読み書きを行う。旧値で読まれた場合は
# scripts/lib/feedback-mode.sh の feedback_mode_normalize() で新値に正規化される。
feedback_mode = "interactive"
# サイクル毎の mirror Issue 起票候補の上限件数（Unit 006 / #590）
# - 重複検出 + 上限ガード後の通過件数がこの値を超えると、超過分は AskUserQuestion 抑制対象
# - user-global で上書き可能（4 階層マージ: project-local / project-shared / user-global / defaults）
# - 不正値（負数 / 非整数）時は警告 + retrospective-schema.yml の feedback_max_per_cycle_default = 3 にフォールバック
feedback_max_per_cycle = 3

# 振り返り集約 Issue の自動起票フラグ（v2.6.4 / #710 / opt-in 基盤 / Unit 004）
# - true（デフォルト）: 既存動作。§1.5 Step 3/4/5 を実行して集約 Issue を 1 件起票する
# - false           : 集約 Issue 起票をスキップ。Try/改善単位起票への移行準備（v2.7.0+ で個別起票実装予定）
# 本フラグは feedback_mode と独立に評価される。feedback_mode=disabled が §1.0 で先に評価されるため、
# auto_issue_creation は mode != disabled の場合のみ §1.5 Step 2 末尾で評価される。
# 既存 cap 判定 / 対話必須トークン / mirror 送信判断のガード機構は本フラグ値に関わらず Step 2 までで評価される。
# false 経路では Step 3/4/5 をスキップする（cap 超過と同じ収束点）。
# 取得失敗時は fail-open（既定動作の起票継続）で warn 出力する。
auto_issue_creation = true
