# AI-DLC Default Configuration
# このファイルはスターターキットのデフォルト値を定義します
# プロジェクトの .aidlc/config.toml で上書き可能です

[rules.feedback]
enabled = true
# Issue 送信先 owner/repo（v2.5.0 で追加 / Unit 005 / #590）
# - mirror モードの retrospective Issue 送信先
# - フォーク利用や貢献先変更時のみ user-global で上書きする
# - 形式: <owner>/<repo>（正規表現: ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ / `/` はちょうど 1 個）
# - 不正値時は警告 + デフォルト（ikeisuke/ai-dlc-starter-kit）にフォールバック
upstream_repo = "ikeisuke/ai-dlc-starter-kit"

[rules.reviewing]
mode = "recommend"
# tools: 優先順位リスト = フォールバック順序。許容エントリは外部 CLI 名 / "self" / "claude"(alias)。
# review-routing.md §4 の暗黙末尾 self 補完シムにより、本デフォルト ["codex"] は実質
# ["codex", "self"] 相当として動作する（既存設定の後方互換性維持、Issue #611 / Unit 002）。
tools = ["codex"]
exclude_patterns = []
codex_bot_account = "chatgpt-codex-connector[bot]"

[rules.release]
changelog = false
version_tag = false

[rules.depth_level]
level = "standard"
history_level = ""

[rules.automation]
mode = "manual"

[rules.construction]
max_retry = 3

[rules.linting]
enabled = false
command = "npx markdownlint-cli2"

[rules.cycle]
mode = "default"
git_tracked = true

[rules.version_check]
enabled = true

[rules.git]
commit_on_unit_complete = true
commit_on_phase_complete = true
branch_mode = "ask"
unit_branch_enabled = false
squash_enabled = false
merge_method = "ask"
draft_pr = "ask"
ai_author = ""
ai_author_auto_detect = true

[rules.documentation]
language = "日本語"

[rules.github]
milestone_enabled = false

[rules.retrospective]
# 許容値（v2.5.1 / 5 値 enum）:
#   - "interactive"        : 04-completion §1.5 直前に wizard を起動して 5 値のいずれかに確定（新規セットアップ既定）
#   - "local-issue-only"   : プロダクトリポジトリの Issue にのみ起票
#   - "mirror-only"        : upstream（AI-DLC starter kit）の Issue にのみ起票
#   - "local-and-mirror"   : 両方に起票（合算 cap）
#   - "disabled"           : 起票しない（振り返り自体はローカル記録）
# 旧値（v2.5.0 まで）"silent" / "mirror" は `aidlc-migrate` で自動マイグレーションされる:
#   - "silent" → "interactive"（同意プロンプト必要 / 非対話時は disabled fallback）
#   - "mirror" → "mirror-only"（同意不要 / 動作互換）
#   - 未設定 → "interactive"（同意プロンプト必要 / 非対話時は disabled fallback）
# read-config.sh / write-config.sh は新値での読み書きを行う。旧値で読まれた場合は
# scripts/lib/feedback-mode.sh の feedback_mode_normalize() で新値に正規化される。
feedback_mode = "interactive"
# サイクル毎の mirror Issue 起票候補の上限件数（Unit 006 / #590）
# - 重複検出 + 上限ガード後の通過件数がこの値を超えると、超過分は AskUserQuestion 抑制対象
# - user-global で上書き可能（4 階層マージ: project-local / project-shared / user-global / defaults）
# - 不正値（負数 / 非整数）時は警告 + retrospective-schema.yml の feedback_max_per_cycle_default = 3 にフォールバック
feedback_max_per_cycle = 3
