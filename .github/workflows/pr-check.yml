name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Detect skip
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PATHS_REGEX: '^(.+\.md|.+\.toml|\.markdownlint\.json|\.github/workflows/pr-check\.yml|bin/check-bash-substitution\.sh|bin/check-defaults-sync\.sh|bin/check-marketplace-version\.sh|\.claude-plugin/marketplace\.json)$'
        run: |
          set -eu
          if [ "$PR_DRAFT" = "true" ]; then
            printf 'should_skip=true\n' >> "$GITHUB_OUTPUT"
            echo "Skip reason: Draft PR"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
          if grep -E "$PATHS_REGEX" "$RUNNER_TEMP/changed-files.txt" >/dev/null; then
            printf 'should_skip=false\n' >> "$GITHUB_OUTPUT"
            echo "Skip reason: none (paths matched)"
          else
            printf 'should_skip=true\n' >> "$GITHUB_OUTPUT"
            echo "Skip reason: paths not match"
          fi

      - name: Checkout
        if: steps.detect.outputs.should_skip != 'true'
        uses: actions/checkout@v4

      - name: Run markdownlint
        if: steps.detect.outputs.should_skip != 'true'
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            docs/translations/**/*.md
            prompts/**/*.md
            *.md

  bash-substitution-check:
    name: Bash Substitution Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Detect skip
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PATHS_REGEX: '^(.+\.md|.+\.toml|\.markdownlint\.json|\.github/workflows/pr-check\.yml|bin/check-bash-substitution\.sh|bin/check-defaults-sync\.sh|bin/check-marketplace-version\.sh|\.claude-plugin/marketplace\.json)$'
        run: |
          set -eu
          if [ "$PR_DRAFT" = "true" ]; then
            printf 'should_skip=true\n' >> "$GITHUB_OUTPUT"
            echo "Skip reason: Draft PR"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
          if grep -E "$PATHS_REGEX" "$RUNNER_TEMP/changed-files.txt" >/dev/null; then
            printf 'should_skip=false\n' >> "$GITHUB_OUTPUT"
            echo "Skip reason: none (paths matched)"
          else
            printf 'should_skip=true\n' >> "$GITHUB_OUTPUT"
            echo "Skip reason: paths not match"
          fi

      - name: Checkout
        if: steps.detect.outputs.should_skip != 'true'
        uses: actions/checkout@v4

      - name: Check bash code blocks for command substitution
        if: steps.detect.outputs.should_skip != 'true'
        run: bash bin/check-bash-substitution.sh

  defaults-sync-check:
    name: Defaults TOML Sync Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Detect skip
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PATHS_REGEX: '^(.+\.md|.+\.toml|\.markdownlint\.json|\.github/workflows/pr-check\.yml|bin/check-bash-substitution\.sh|bin/check-defaults-sync\.sh|bin/check-marketplace-version\.sh|\.claude-plugin/marketplace\.json)$'
        run: |
          set -eu
          if [ "$PR_DRAFT" = "true" ]; then
            printf 'should_skip=true\n' >> "$GITHUB_OUTPUT"
            echo "Skip reason: Draft PR"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
          if grep -E "$PATHS_REGEX" "$RUNNER_TEMP/changed-files.txt" >/dev/null; then
            printf 'should_skip=false\n' >> "$GITHUB_OUTPUT"
            echo "Skip reason: none (paths matched)"
          else
            printf 'should_skip=true\n' >> "$GITHUB_OUTPUT"
            echo "Skip reason: paths not match"
          fi

      - name: Checkout
        if: steps.detect.outputs.should_skip != 'true'
        uses: actions/checkout@v4

      - name: Install dasel and jq (v2.6.5 Unit 004 - Phase 2 structural comparison deps)
        if: steps.detect.outputs.should_skip != 'true'
        env:
          # SECURITY-10 supply-chain: バージョン pin + sha256 検証必須 (mutable latest 禁止)
          # 更新時は dasel リリースページ <https://github.com/TomWright/dasel/releases> から
          # 該当バージョンの dasel_linux_amd64.sha256 値をコピーする
          DASEL_VERSION: "v3.10.1"
          DASEL_SHA256: "e35d899a846828c87884e1834ac1f58df2d4d03b32af0d6ee12c8d207b81b1fb"
        run: |
          set -eu
          # jq is preinstalled on ubuntu-latest, dasel needs explicit install
          if ! command -v dasel >/dev/null 2>&1; then
            tmp_dir=$(mktemp -d)
            trap 'rm -rf "$tmp_dir"' EXIT
            curl -sSLf "https://github.com/TomWright/dasel/releases/download/${DASEL_VERSION}/dasel_linux_amd64" -o "$tmp_dir/dasel"
            # SECURITY-10: sha256 整合性検証 (CI で失敗時はバージョンまたは hash の同期忘れ)
            echo "${DASEL_SHA256}  $tmp_dir/dasel" | sha256sum -c -
            sudo install -m 0755 "$tmp_dir/dasel" /usr/local/bin/dasel
          fi
          command -v dasel
          command -v jq
          dasel --help >/dev/null 2>&1 || dasel version

      - name: Check defaults.toml sync between aidlc and aidlc-setup
        if: steps.detect.outputs.should_skip != 'true'
        run: bash bin/check-defaults-sync.sh

  marketplace-version-check:
    name: Marketplace Version Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Detect skip
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PATHS_REGEX: '^(CHANGELOG\.md|\.aidlc/operations\.md|\.claude-plugin/marketplace\.json|bin/check-marketplace-version\.sh|\.github/workflows/pr-check\.yml)$'
        run: |
          set -eu
          if [ "$PR_DRAFT" = "true" ]; then
            printf 'should_skip=true\n' >> "$GITHUB_OUTPUT"
            echo "Skip reason: Draft PR"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/changed-files.txt"
          if grep -E "$PATHS_REGEX" "$RUNNER_TEMP/changed-files.txt" >/dev/null; then
            printf 'should_skip=false\n' >> "$GITHUB_OUTPUT"
            echo "Skip reason: none (paths matched)"
          else
            printf 'should_skip=true\n' >> "$GITHUB_OUTPUT"
            echo "Skip reason: paths not match"
          fi

      - name: Checkout
        if: steps.detect.outputs.should_skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check marketplace.json metadata.version is updated when release-relevant files change
        if: steps.detect.outputs.should_skip != 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eu
          git fetch --no-tags origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"
          bash bin/check-marketplace-version.sh --base "origin/${BASE_REF}" --current HEAD
